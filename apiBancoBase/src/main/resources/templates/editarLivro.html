<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Livro</title>
</head>

<body>

    <h1>Editar Livro</h1>

    <form th:action="@{/front/livros/editar}" method="post">

        <input type="hidden" name="id" th:value="${livro.id}">

        <label>Título:</label>
        <input type="text" name="titulo" th:value="${livro.titulo}" required>
        <br><br>

        <label>Autor:</label>
        <input type="text" name="autor" th:value="${livro.autor}" required>
        <br><br>

        <label>Área:</label>
        <input type="text" name="area" th:value="${livro.area}" required>
        <br><br>

        <label>Editora:</label>
        <input type="text" name="editora" th:value="${livro.editora}" required>
        <br><br>

        <label>Ano de Publicação:</label>
        <input type="number" name="anoPublicacao"
            th:value="${livro.anoPublicacao}" required>
        <br><br>

        <label>ISBN:</label>
        <input type="text" name="isbn" th:value="${livro.isbn}" required>
        <br><br>

        <button type="submit">Salvar Alterações</button>

    </form>

    <br>

    <a th:href="@{/front/livros}">
        Cancelar
    </a>

</body>
</html>
