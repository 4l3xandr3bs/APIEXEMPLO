<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>

<h1>Login</h1>

<form th:action="@{/front/login}" method="post">

    <label>Login:</label>
    <input type="text" name="login" required>

    <br><br>

    <label>Senha:</label>
    <input type="password" name="senha" required>

    <br><br>

    <button type="submit">
        Entrar
    </button>

</form>

<p th:if="${erro}" th:text="${erro}"></p>

</body>

</html>
