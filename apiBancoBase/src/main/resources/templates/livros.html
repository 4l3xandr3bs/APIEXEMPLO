<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Livros</title>
</head>

<body>

    <h1>Lista de Livros</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Editora</th>
            <th>Ano</th>
            <th>ISBN</th>
            <th>Ações</th>
        </tr>

        <tr th:each="livro : ${livros}">
            <td th:text="${livro.id}"></td>
            <td th:text="${livro.titulo}"></td>
            <td th:text="${livro.autor}"></td>
            <td th:text="${livro.editora}"></td>
            <td th:text="${livro.anoPublicacao}"></td>
            <td th:text="${livro.isbn}"></td>

            <td>
                <a th:href="@{/front/livros/editar/{id}(id=${livro.id})}" > Editar </a>
                <a th:href="@{/front/livros/deletar/{id}(id=${livro.id})}"
                onclick="return confirm('Deseja realmente excluir este livro?');"> Excluir </a>
            </td>

        </tr>
    </table>

    <a th:href="@{/front/livros/paginaCadastrar}">Cadastrar Novo Funcionário</a>

</body>
</html>
